name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node contract, CLI, and wizard regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run wizard regression
        run: |
          node tests/catalog-generator-regression.js scripts/generate-model-catalog.js
          node tests/wizard-regression.js wizard/index.html
          node tests/manifest-regression.js scripts/validate-manifest.js
          node tests/governance-regression.js
          node tests/cli-regression.js scripts/ezdeploy.js

  bicep-validation:
    name: Bicep validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bicep
        run: az bicep install

      - name: Compile templates and parameter files
        shell: pwsh
        run: ./tests/bicep-regression.ps1

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Bash files
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ezdeploy-engine.sh
          bash -n tests/engine-regression.sh

  engine-regression:
    name: Fake-Azure engine regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v jq
          command -v tar
          command -v pwsh.exe || command -v pwsh

      - name: Run fake-Azure engine regression
        shell: bash
        run: bash tests/engine-regression.sh scripts/ezdeploy-engine.sh
