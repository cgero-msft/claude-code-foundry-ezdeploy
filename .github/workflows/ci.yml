name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wizard-regression:
    name: Node wizard regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run wizard regression
        run: node tests/wizard-regression.js wizard/index.html

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Bash files
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ezdeploy-engine.sh
          bash -n tests/engine-regression.sh

  engine-regression:
    name: Fake-Azure engine regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v jq
          command -v tar
          command -v pwsh.exe

      - name: Run fake-Azure engine regression
        shell: bash
        run: bash tests/engine-regression.sh scripts/ezdeploy-engine.sh
