name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-source:
    name: Tracked source patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan tracked source files
        shell: bash
        run: |
          set -Eeuo pipefail

          pattern='-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{80,}|xox[baprs]-[A-Za-z0-9-]{20,}|AccountKey=[A-Za-z0-9+/]{40,}={0,2}'
          mapfile -t matches < <(
            git grep -lI -E -e "$pattern" -- \
              '*.sh' '*.js' '*.html' '*.ps1' '*.json' '*.yml' '*.yaml' \
              ':(exclude)tests/**' \
              ':(exclude).github/workflows/**' ||
              true
          )

          if ((${#matches[@]} > 0)); then
            printf 'Potential secrets found in tracked source files:\n'
            printf '  %s\n' "${matches[@]}"
            exit 1
          fi

          printf 'No basic secret signatures found in tracked source files.\n'
